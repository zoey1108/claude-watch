name: ClaudeTap
options:
  bundleIdPrefix: com.zoey1108
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: G692HH5654
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: AI 一点通
targets:
  # 上架用的 iOS 外壳：仅手表 App 也必须包一层，用户看不到它（与 Xcode「Watch-only App」模板一致）
  ClaudeTap:
    type: application.watchapp2-container
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoey1108.claudetap
        PRODUCT_NAME: AI 一点通
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - target: ClaudeTapWatch
  ClaudeTapWatch:
    type: application
    platform: watchOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.zoey1108.claudetap
            CFBundleURLSchemes: [claudetap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoey1108.claudetap.watchkitapp
        PRODUCT_NAME: ClaudeTap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ClaudeTapWidget
  ClaudeTapWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoey1108.claudetap.watchkitapp.widget
        SKIP_INSTALL: YES
schemes:
  ClaudeTap:
    build:
      targets:
        ClaudeTap: all
    run:
      config: Debug
    archive:
      config: Release
  ClaudeTapWatch:
    build:
      targets:
        ClaudeTapWatch: all
    run:
      config: Debug
